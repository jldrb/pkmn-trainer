<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ECF0F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F151C" media="(prefers-color-scheme: dark)">
<title>Champions Stat Trainer</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stat Trainer">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  color-scheme:light;
  --paper:#ECF0F4; --card:#FFFFFF; --sunk:#F3F6F9; --ink:#17202B; --ink-2:#4E5A68; --ink-3:#7C8794;
  --rule:#D2D9E1; --rule-2:#E4E9EE; --signal:#CC3A1F; --signal-2:#AE2F17; --focus:#2563EB;
  --hp:#E5534B; --atk:#EC8A39; --def:#CFA514; --spa:#4A7DDF; --spd:#36A064; --spe:#D23F7E;
  --good:#21915A; --mid:#C2850E; --bad:#CC3A1F;
  --shadow:0 1px 2px rgba(23,32,43,.06),0 6px 18px rgba(23,32,43,.05);
  --heat-l:47%;
  --font:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --cond:'Barlow Condensed','Arial Narrow','Roboto Condensed',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --paper:#0F151C; --card:#17202A; --sunk:#111922; --ink:#E7ECF1; --ink-2:#A3AFBC; --ink-3:#77838F;
  --rule:#2B3743; --rule-2:#212B36; --signal:#F0583A; --signal-2:#FF6E50; --focus:#7AA7FF;
  --hp:#F06A62; --atk:#F39B52; --def:#E6C13A; --spa:#6D97F0; --spd:#55BE80; --spe:#EE5E9B;
  --good:#3DBA76; --mid:#E0A22B; --bad:#F0583A; --shadow:none; --heat-l:58%;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0F151C; --card:#17202A; --sunk:#111922; --ink:#E7ECF1; --ink-2:#A3AFBC; --ink-3:#77838F;
  --rule:#2B3743; --rule-2:#212B36; --signal:#F0583A; --signal-2:#FF6E50; --focus:#7AA7FF;
  --hp:#F06A62; --atk:#F39B52; --def:#E6C13A; --spa:#6D97F0; --spd:#55BE80; --spe:#EE5E9B;
  --good:#3DBA76; --mid:#E0A22B; --bad:#F0583A; --shadow:none; --heat-l:58%;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;padding:26px 18px 20px;border-right:1px solid var(--rule);display:flex;flex-direction:column;gap:26px}
.brand{padding:0 8px}
.brand .word{font:800 30px/.92 var(--cond);letter-spacing:-.01em;margin:0}
.brand .sub{font-size:13px;color:var(--ink-2);margin-top:8px;line-height:1.35}
.stripe{display:flex;height:6px;border-radius:3px;overflow:hidden;margin-top:12px}
.stripe span{flex:1}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{position:relative;display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;padding:10px 12px;border:0;border-radius:10px;background:transparent;color:var(--ink-2);font-weight:600;font-size:16px;cursor:pointer;text-align:left}
.nav button:hover{background:var(--rule-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.nav button[aria-current="page"]::before{content:'';position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--signal)}
.nav .count{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.rail-foot{margin-top:auto;padding:0 8px;font-size:13px;color:var(--ink-3);display:flex;flex-direction:column;gap:8px}
.savestate{display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);flex:none}
.dot.warn{background:var(--mid)}
main{padding:34px clamp(16px,4vw,52px) 110px;min-width:0}
.panel-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
h1{font:800 46px/1 var(--cond);margin:0;letter-spacing:-.01em}
h2{font:800 26px/1.1 var(--cond);margin:0 0 12px}
h3{font:700 20px/1.15 var(--cond);margin:0 0 8px}
.lede{margin:8px 0 0;color:var(--ink-2);max-width:70ch}
.muted{color:var(--ink-2)}
.small{font-size:14px}
a{color:var(--focus)}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{position:fixed;inset:auto 0 0 0;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--rule);background:var(--card);z-index:40;gap:0}
  .brand,.rail-foot{display:none}
  .nav{flex-direction:row;width:100%}
  .nav button{flex:1;flex-direction:column;justify-content:center;gap:0;font-size:13px;padding:8px 2px;text-align:center}
  .nav button[aria-current="page"]{box-shadow:none;background:var(--rule-2)}
  .nav button[aria-current="page"]::before{left:30%;right:30%;top:auto;bottom:2px;width:auto;height:3px}
  .nav .count{font-size:11px}
  main{padding:22px 14px 120px}
  h1{font-size:38px}
}

/* ---------- controls ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.toolbar .grow{flex:1 1 220px}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--rule-2);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 13px;border-radius:8px;font-weight:600;font-size:14px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:8px 16px;border-radius:10px;border:1px solid var(--rule);background:var(--card);color:var(--ink);font-weight:600;font-size:15px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--signal);border-color:var(--signal);color:#fff}
.btn.primary:hover{background:var(--signal-2);border-color:var(--signal-2)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{color:var(--ink);background:var(--rule-2)}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:32px;padding:4px 11px;font-size:14px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
input[type=search],input[type=text],input[type=number],select,textarea{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:8px 12px;min-height:40px;font-size:15px}
textarea{width:100%;min-height:180px;font:500 13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;resize:vertical}
input[type=search]{width:100%}
label.inline{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px;color:var(--ink-2)}
.section{margin-top:30px}
.box{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:18px 20px}
.empty{background:var(--card);border:1px dashed var(--rule);border-radius:14px;padding:34px 24px;text-align:center}
.empty p{margin:6px auto 16px;max-width:52ch;color:var(--ink-2)}

/* ---------- types & images ---------- */
.types{display:flex;gap:4px;flex-wrap:wrap}
.type{font-weight:700;font-size:12px;line-height:1;padding:4px 7px 4px;border-radius:5px;background:var(--t);color:var(--tc,#fff)}
.mega-tag{display:inline-block;font-weight:700;font-size:12px;line-height:1;padding:3px 6px;border-radius:5px;border:1px solid var(--ink-3);color:var(--ink-2);vertical-align:2px}
.pimg{position:relative;aspect-ratio:1;border-radius:12px;background:var(--sunk);overflow:hidden;display:grid;place-items:center;flex:none}
.pimg img{position:absolute;inset:6%;width:88%;height:88%;object-fit:contain;z-index:1}
.pimg .ph{display:none;place-items:center;width:100%;height:100%;font:800 28px/1 var(--cond);color:#fff;background:linear-gradient(135deg,var(--t1),var(--t2))}
.pimg.noimg .ph{display:grid}
.pimg.hidden img,.pimg.hidden .ph{visibility:hidden}

/* ---------- usage list ---------- */
.ulist{background:var(--card);border:1px solid var(--rule);border-radius:14px;overflow:hidden}
.urow{display:grid;grid-template-columns:52px 52px minmax(0,1fr) 84px 84px 168px;align-items:center;gap:14px;padding:8px 16px;border-top:1px solid var(--rule-2)}
.urow.head{border-top:0;padding-top:12px;padding-bottom:10px;font-size:13px;font-weight:600;color:var(--ink-3);background:var(--sunk)}
.urow .rank{font:800 26px/1 var(--cond);color:var(--ink-3);font-variant-numeric:tabular-nums;text-align:right}
.urow .pimg{width:52px;height:52px;border-radius:10px}
.urow .pimg .ph{font-size:16px}
.uname{font:700 20px/1.1 var(--cond)}
.umeta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:4px;font-size:13px;color:var(--ink-2)}
.unum{font:700 22px/1 var(--cond);font-variant-numeric:tabular-nums;text-align:right}
.unum.spe{color:var(--spe)}
.m-only{display:none}
.umeta .m-only b{color:var(--spe);font:700 15px/1 var(--cond)}
.uact{display:flex;align-items:center;justify-content:flex-end;gap:8px}
.status{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.status.batch{background:color-mix(in srgb,var(--signal) 14%,transparent);color:var(--signal)}
.status.learned{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
@media (max-width:980px){.urow{grid-template-columns:40px 48px minmax(0,1fr) 64px 132px}.urow .c-lv{display:none}}
@media (max-width:560px){.urow{grid-template-columns:30px 44px minmax(0,1fr) 92px;gap:10px;padding:8px 10px}.urow .c-base{display:none}.umeta .m-only{display:inline}.urow .rank{font-size:20px}.urow .status{display:none}}

.sticky{position:sticky;bottom:16px;z-index:20;margin-top:16px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;background:var(--ink);color:var(--paper);padding:12px 14px 12px 18px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.sticky .btn{border-color:transparent}
.sticky .btn.ghost{color:var(--paper)}
.sticky .btn.ghost:hover{background:rgba(255,255,255,.12)}
@media (max-width:860px){.sticky{bottom:86px}}

/* ---------- batch tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.tile{position:relative;background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:10px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;text-align:center}
.tile:hover{border-color:var(--ink-3)}
.tile[aria-pressed="true"]{border-color:var(--signal);box-shadow:inset 0 0 0 2px var(--signal)}
.tile .pimg{width:86px;height:86px}
.tile .tn{font:700 17px/1.1 var(--cond)}
.tile .tr{font-size:12px;color:var(--ink-3)}
.tile .tick{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;border:2px solid var(--rule);display:grid;place-items:center;background:var(--card)}
.tile[aria-pressed="true"] .tick{background:var(--signal);border-color:var(--signal)}
.tile .tick svg{width:12px;height:12px;opacity:0}
.tile[aria-pressed="true"] .tick svg{opacity:1}
.tile .tlabel{position:absolute;top:9px;left:9px;font-size:11px;font-weight:700;color:var(--good)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:3px 12px 3px 3px;border-radius:999px;background:var(--sunk);border:1px solid var(--rule-2);font-weight:600;font-size:14px}
.chip .pimg{width:30px;height:30px;border-radius:50%}
.chip .pimg .ph{font-size:11px}

/* ---------- pokemon cards ---------- */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:1200px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.grid{grid-template-columns:1fr}}
.pcard{background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;cursor:pointer;text-align:left;transition:border-color .15s}
.pcard:hover{border-color:var(--ink-3)}
.pcard-top{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;align-items:center}
.pcard .pimg{width:120px;height:120px}
.pmeta{min-width:0;display:flex;flex-direction:column;gap:5px}
.prank{font-size:13px;font-weight:600;color:var(--ink-3)}
.pname{font:800 25px/1 var(--cond);overflow-wrap:anywhere}
.spe-big{display:flex;align-items:baseline;gap:7px;margin-top:2px}
.spe-big b{font:800 42px/.9 var(--cond);color:var(--spe);font-variant-numeric:tabular-nums}
.spe-big span{font-size:13px;font-weight:600;color:var(--ink-2);line-height:1.15}
.pnote{font-size:13px;color:var(--ink-2);margin:-2px 0 -4px}
.heat-legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:-8px 0 16px;font-size:13px;color:var(--ink-2)}
.heat-bar{width:140px;height:8px;border-radius:4px}
.heat-ticks{display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.heat-ticks i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-left:6px}
.unum small{display:block;font:600 12px/1.2 var(--font);color:var(--ink-3);margin-top:3px}
.pfoot{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--ink-2);border-top:1px solid var(--rule-2);padding-top:9px}

/* ---------- stat bars ---------- */
.bars{display:grid;grid-template-columns:auto minmax(0,1fr) auto;column-gap:10px;row-gap:6px;align-items:center}
.bars .k{font-size:13px;font-weight:700;color:var(--ink-2);min-width:30px}
.bars .track{position:relative;height:10px;border-radius:5px;background:var(--rule-2);overflow:hidden}
.bars .track::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(25% - 1px),color-mix(in srgb,var(--card) 70%,transparent) calc(25% - 1px) 25%);pointer-events:none}
.bars.has-range{grid-template-columns:auto minmax(0,1fr) auto auto}
.bars .band{position:absolute;top:0;bottom:0;border-radius:5px;background:color-mix(in srgb,var(--c) 30%,transparent)}
.bars .rg{font-size:12px;font-weight:600;color:var(--ink-3);font-variant-numeric:tabular-nums;text-align:right;min-width:52px;white-space:nowrap}
.bars .fill{position:relative;z-index:1;display:block;height:100%;border-radius:5px;background:var(--c);transition:width .55s cubic-bezier(.2,.8,.2,1)}
.bars .v{font:700 18px/1 var(--cond);font-variant-numeric:tabular-nums;min-width:32px;text-align:right}
.bars .is-spe .k,.bars .is-spe.v{color:var(--spe)}
.bars.big{row-gap:10px;column-gap:14px}
.bars.big .k{font-size:15px;min-width:40px}
.bars.big .track{height:18px;border-radius:9px}
.bars.big .fill{border-radius:9px}
.bars.big .v{font-size:30px;min-width:48px}

/* ---------- train ---------- */
.trainbar{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:flex-end;margin-bottom:20px}
.cgroup{display:flex;flex-direction:column;gap:5px;min-width:0;max-width:100%}
.cgroup .label{font-size:13px;font-weight:600;color:var(--ink-3);padding-left:2px}
.ladder{background:var(--card);border:1px solid var(--rule);border-radius:14px;overflow:hidden}
.lrow{display:grid;grid-template-columns:70px minmax(0,1fr);gap:14px;align-items:center;padding:8px 16px;border-top:1px solid var(--rule-2)}
.lrow:first-child{border-top:0}
.lval{font:800 30px/1 var(--cond);color:var(--spe);font-variant-numeric:tabular-nums;text-align:right}
.lchip{display:inline-flex;align-items:center;gap:8px;padding:3px 12px 3px 3px;border-radius:999px;background:var(--sunk);border:1px solid var(--rule-2);font-weight:600;font-size:14px;cursor:pointer}
.lchip:hover{border-color:var(--ink-3)}
.lchip .pimg{width:32px;height:32px;border-radius:50%}
.lchip .pimg .ph{font-size:11px}
.lchip small{color:var(--ink-3);font-weight:600}

.quiz{max-width:780px;margin:0 auto}
.qcard{background:var(--card);border:1px solid var(--rule);border-radius:20px;padding:22px 26px 26px;box-shadow:var(--shadow)}
.qhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;color:var(--ink-2);font-size:14px;font-weight:600}
.qprog{height:6px;background:var(--rule-2);border-radius:3px;overflow:hidden;margin:10px 0 20px}
.qprog i{display:block;height:100%;background:var(--ink);border-radius:3px;transition:width .3s}
.qtitle{font:800 30px/1.05 var(--cond);margin:0 0 6px}
.qnote{color:var(--ink-2);margin:0 0 18px;font-size:15px}
.qtotal{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--rule-2);font-size:14px;color:var(--ink-2)}
.qtotal b{font:800 22px/1 var(--cond);color:var(--ink)}
.answer{display:flex;gap:10px;margin-top:20px}
.answer input{flex:1;font-size:19px;min-height:52px;padding:10px 14px}
.answer .btn{min-height:52px;padding:0 22px}
.qerr{color:var(--bad);font-weight:600;font-size:14px;margin-top:8px}
.qerr:empty{display:none}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.choice{display:flex;align-items:center;gap:12px;min-height:58px;padding:8px 14px;border-radius:12px;border:1px solid var(--rule);background:var(--card);font:700 21px/1.1 var(--cond);cursor:pointer;text-align:left}
.choice:hover:not(:disabled){border-color:var(--ink-3)}
.choice .key{display:grid;place-items:center;width:24px;height:24px;border-radius:6px;background:var(--rule-2);font:700 13px var(--font);color:var(--ink-2);flex:none}
.choice.is-right{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--card))}
.choice.is-wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--card))}
.choice:disabled{cursor:default}
@media (max-width:560px){.choices{grid-template-columns:1fr}}
.recall{display:grid;grid-template-columns:250px minmax(0,1fr);gap:26px;align-items:start}
.recall>div{min-width:0}
.recall .pimg{width:250px;height:250px;border-radius:18px}
@media (max-width:640px){.recall{grid-template-columns:1fr}.recall .pimg{width:180px;height:180px;margin:0 auto}}
.qname{font:800 36px/1 var(--cond);margin:4px 0 8px;overflow-wrap:anywhere}
.ask{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.ask label{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:14px;color:var(--ink-2)}
.ask input{font:800 34px/1 var(--cond);text-align:center;height:68px;font-variant-numeric:tabular-nums;width:100%;min-width:0;-moz-appearance:textfield;appearance:textfield}
.ask input::-webkit-outer-spin-button,.ask input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.ask .is-spe{color:var(--spe)}
.ask .is-spe input{border-color:var(--spe);border-width:2px}
.ask .btn{grid-column:1/-1;min-height:50px}
.fb{margin-top:20px;padding:16px 18px;border-radius:14px;border:1px solid var(--rule);background:var(--sunk)}
.fb.good{border-color:color-mix(in srgb,var(--good) 55%,transparent);background:color-mix(in srgb,var(--good) 9%,var(--card))}
.fb.mid{border-color:color-mix(in srgb,var(--mid) 55%,transparent);background:color-mix(in srgb,var(--mid) 9%,var(--card))}
.fb.bad{border-color:color-mix(in srgb,var(--bad) 55%,transparent);background:color-mix(in srgb,var(--bad) 8%,var(--card))}
.fb-top{display:flex;gap:14px;align-items:center}
.fb-top .pimg{width:76px;height:76px}
.fb-title{font:800 26px/1.05 var(--cond)}
.fb table{width:100%;border-collapse:collapse;margin-top:12px;font-variant-numeric:tabular-nums}
.fb th{font-size:13px;color:var(--ink-3);font-weight:600;text-align:right;padding:4px 8px}
.fb th:first-child,.fb td:first-child{text-align:left}
.fb td{padding:6px 8px;border-top:1px solid var(--rule-2);text-align:right;font:700 20px/1 var(--cond)}
.fb td:first-child{font:600 15px var(--font)}
.res-good{color:var(--good)} .res-mid{color:var(--mid)} .res-bad{color:var(--bad)}
.qnext{display:flex;align-items:center;gap:12px;margin-top:18px}
.kbdhint{font-size:13px;color:var(--ink-3)}
.start{max-width:680px;margin:0 auto}
.start .opts{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin:16px 0 22px}

/* ---------- progress ---------- */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--card);border:1px solid var(--rule);border-radius:14px;overflow:hidden}
.board>div{padding:16px 20px;border-left:1px solid var(--rule-2)}
.board>div:first-child{border-left:0}
.fig{font:800 40px/1 var(--cond);font-variant-numeric:tabular-nums}
.fig small{font-size:20px;color:var(--ink-3);margin-left:2px}
.cap{font-size:14px;color:var(--ink-2);margin-top:6px;line-height:1.3}
@media (max-width:760px){.board{grid-template-columns:1fr 1fr}.board>div:nth-child(3){border-left:0}.board>div:nth-child(n+3){border-top:1px solid var(--rule-2)}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:980px){.two{grid-template-columns:1fr}}
.chart svg{width:100%;height:auto;display:block}
.chart text{font:600 11px var(--font);fill:var(--ink-3)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--ink-2);margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px}
.rows{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:7px 0;border-top:1px solid var(--rule-2)}
.prow:first-child{border-top:0}
.prow .pimg{width:40px;height:40px;border-radius:10px}
.prow .pimg .ph{font-size:13px}
.prow b{font:700 18px/1.1 var(--cond)}
.prow .r{font:700 20px/1 var(--cond);font-variant-numeric:tabular-nums;text-align:right}
.mbar{display:flex;height:22px;border-radius:11px;overflow:hidden;background:var(--rule-2)}
.mbar span{height:100%}
.mkey{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px;color:var(--ink-2)}
.mkey i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}

/* ---------- save & settings ---------- */
.settings{background:var(--card);border:1px solid var(--rule);border-radius:14px;overflow:hidden}
.set-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center;padding:14px 20px;border-top:1px solid var(--rule-2)}
.set-row:first-child{border-top:0}
.set-row .t{font-weight:700}
.set-row p{margin:2px 0 0;font-size:14px;color:var(--ink-2);max-width:62ch}
.set-row .ctl{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
@media (max-width:640px){.set-row{grid-template-columns:1fr}.set-row .ctl{justify-content:flex-start}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:14px}
.kv dt{color:var(--ink-3);font-weight:600}
.kv dd{margin:0}

/* ---------- modal & toast ---------- */
.modal-back{position:fixed;inset:0;background:rgba(9,13,18,.5);display:grid;place-items:center;padding:16px;z-index:60}
.modal{position:relative;background:var(--card);border-radius:20px;width:100%;max-width:880px;max-height:calc(100vh - 32px);overflow:auto;padding:26px 28px;box-shadow:0 24px 70px rgba(0,0,0,.3)}
.modal.narrow{max-width:560px}
.modal .x{position:absolute;top:14px;right:14px}
.detail{display:grid;grid-template-columns:300px minmax(0,1fr);gap:28px}
.detail .pimg{width:300px;height:300px;border-radius:18px}
@media (max-width:760px){.detail{grid-template-columns:1fr}.detail .pimg{width:200px;height:200px}}
.detail-cols{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:16px}
@media (max-width:560px){.detail-cols{grid-template-columns:1fr}}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);width:max-content;background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:12px;font-weight:600;font-size:15px;z-index:80;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100vw - 32px)}
@media (max-width:860px){.toast{bottom:96px}}

/* ---------- types ---------- */
.type .x{margin-left:5px;padding-left:5px;border-left:1px solid color-mix(in srgb,var(--tc) 40%,transparent);font-weight:800}
.type.tbig{font-size:16px;padding:7px 12px;border-radius:7px}
.tcard{background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.tc-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.tc-lvl{font-size:12px;font-weight:700;color:var(--ink-3)}
.tc-mons{font-size:13px;color:var(--ink-2);margin-top:-4px}
.tsec h4{font-size:13px;font-weight:700;color:var(--ink-3);margin:2px 0 2px}
.trow{display:grid;grid-template-columns:118px minmax(0,1fr);gap:10px;align-items:start;padding:6px 0;border-top:1px solid var(--rule-2)}
.trow .tl{font-size:13px;font-weight:600;color:var(--ink-2);padding-top:2px}
.trow .none{font-size:13px;color:var(--ink-3)}
.tprofile{background:var(--sunk);border-radius:12px;padding:6px 14px 10px;margin-bottom:16px}
.tpicker{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px}
.tpick{min-height:42px;padding:6px 4px;border-radius:9px;border:2px solid var(--t);background:var(--card);color:var(--ink);font-weight:700;font-size:14px;cursor:pointer}
.tpick:hover:not(:disabled){background:color-mix(in srgb,var(--t) 14%,var(--card))}
.tpick[aria-pressed="true"]{background:var(--t);color:var(--tc)}
.tpick.none{--t:var(--ink-3)}
.tpick.none[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tpick:disabled{cursor:default}
.tpick:disabled:not([aria-pressed="true"]){opacity:.55}
.multq{display:flex;flex-wrap:wrap;align-items:center;gap:12px;font-weight:600}
.mchoices{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-top:18px}
.mchoice{justify-content:center;font-size:26px}
details summary{cursor:pointer;color:var(--ink-2);font-weight:600}
@media (max-width:640px){.tpicker{grid-template-columns:repeat(3,minmax(0,1fr))}.mchoices{grid-template-columns:repeat(3,minmax(0,1fr))}.trow{grid-template-columns:96px minmax(0,1fr)}}
@media (max-width:860px){
  .seg{flex-wrap:nowrap;overflow-x:auto;max-width:100%;scrollbar-width:none}
  .seg::-webkit-scrollbar{display:none}
  .cgroup{width:100%}
  .trainbar{gap:10px}
  .qcard{padding:16px 16px 20px;border-radius:16px}
  .qtitle{font-size:26px}
  .qname{font-size:30px}
  .bars.big .v{font-size:24px}
  .recall{gap:14px}
  .recall .pimg{width:150px;height:150px}
  .panel-head .lede{font-size:15px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>

function defaultState() {

    settings: {...DEFAULT_SETTINGS},
    batches: [], current: null, draft: [],

    createdAt: Date.now(), lastOpen: 0, savedAt: 0

function migrate(s) {

  const out = {...d, ...s};
  out.settings = {...d.settings, ...(s.settings || {})};
  out.ui = {...d.ui, ...(s.ui || {})};
  out.usage = s.usage && Array.isArray(s.usage.rows) && s.usage.rows.length ? {extra: [], ...s.usage} : d.usage;
  if (out.settings.statView !== 'base') out.settings.statView = 'champ';

  for (const k of ['batches','draft','log']) if (!Array.isArray(out[k])) out[k] = [];
  for (const k of ['pool','cards','days']) if (!out[k] || typeof out[k] !== 'object') out[k] = {};

}
function load() {

}

/* =========================================================
   Data model built from the usage snapshot
   ========================================================= */
let DATA = null;
function buildData(usage) {
  const species = {}, forms = {}, ranking = [];
  const add = (r, ranked) => {
    const [rank, id, name, dex, art, types, base, nature, sp, item, megas] = r;
    if (!id || species[id]) { if (ranked && species[id] && species[id].rank == null) { species[id].rank = rank; ranking.push(id); } return; }
    const s = {id, name, dex, art, types: String(types).split('/'), base: parseStats(base), nature, sp: parseStats(sp), item, megas: [], rank: ranked ? rank : null};
    species[id] = s;
    forms[id] = {id, speciesId: id, name, dex, art, types: s.types, base: s.base, nature, sp: s.sp, item, isMega: false};
    (megas || []).forEach(m => {
      const [mid, mname, mart, mtypes, mbase, stone, stonePct] = m;
      forms[mid] = {id: mid, speciesId: id, name: mname, dex, art: mart || 0, types: String(mtypes).split('/'), base: parseStats(mbase),
        nature, sp: s.sp, item: stone, stone, stonePct, isMega: true};
      s.megas.push(mid);
    });
    if (ranked) ranking.push(id);
  };
  [...usage.rows].sort((a, b) => a[0] - b[0]).forEach(r => add(r, true));
  (usage.extra || []).forEach(r => add(r, false));
  BUILTIN.rows.forEach(r => add(r, false)); // keeps anything from history resolvable
  const alias = new Map();
  Object.values(forms).forEach(f => aliasesOf(f).forEach(a => { if (!alias.has(a)) alias.set(a, f.id); }));
  return {species, forms, ranking, alias, meta: usage.meta || {}};
}
function aliasesOf(f) {
  const a = new Set([norm(f.name), norm(f.id)]);
  const m = f.name.match(/^(.*) \((.*)\)$/);
  if (m) {
    const [, base, tag] = m;
    a.add(norm(base + tag)); a.add(norm(tag + base));
    const adj = {Hisui:'Hisuian', Alola:'Alolan', F:'Female', M:'Male', Eternal:'Eternal Flower'}[tag];
    if (adj) { a.add(norm(adj + base)); a.add(norm(base + adj)); }
    if (tag === 'M' || tag === 'Fancy') a.add(norm(base));
    if (tag === 'Wash' || tag === 'Heat') { a.add(norm(tag + ' rotom')); }
  }
  if (f.isMega) {
    const rest = f.name.replace(/^Mega /, '');
    a.add(norm(rest + 'mega'));
    const p = rest.split(' ');
    if (p.length === 2) { a.add(norm(p[0] + 'mega' + p[1])); a.add(norm('mega' + p[0] + p[1])); }
  }
  return a;
}
function findForm(text) { const id = DATA.alias.get(norm(text)); return id ? DATA.forms[id] : null; }

function fillDatalist() {
  const names = Object.values(DATA.forms).map(f => f.name).sort((a, b) => a.localeCompare(b));
  $('#all-names').innerHTML = names.map(n => `<option value="${esc(n)}">`).join('');
}

/* stats at the chosen view
   base   : species base stats
   champ  : Champions Lv 50, perfect IVs, 0 Stat Points, neutral nature (HP = base + 75, others = base + 20)
   spread : Lv 50 with the common nature and Stat Points (kept for reference, not displayed) */
function statsOf(f, view) {
  if (view === 'base') return {...f.base};
  if (view !== 'spread') { const o = {}; STATS.forEach(k => o[k] = f.base[k] + (k === 'hp' ? 75 : 20)); return o; }
  const nat = NATURES[f.nature] || null, o = {};
  STATS.forEach(k => {
    const b = f.base[k], s = f.sp[k] || 0;
    if (k === 'hp') { o[k] = b + s + 75; return; }
    const v = b + s + 20;
    o[k] = nat && nat[0] === k ? Math.floor(v * 11 / 10) : nat && nat[1] === k ? Math.floor(v * 9 / 10) : v;
  });
  return o;
}
const total = st => STATS.reduce((a, k) => a + st[k], 0);
/* reachable Champions range: min = 0 SP + hindering nature, max = 32 SP + boosting nature (HP has no nature) */
function rangeOf(f) {
  const o = {};
  STATS.forEach(k => { const b = f.base[k]; o[k] = k === 'hp' ? [b + 75, b + 107] : [Math.floor((b + 20) * 9 / 10), Math.floor((b + 52) * 11 / 10)]; });
  return o;
}
/* heat colour from a base stat: red (low) > orange > yellow > green > blue (very high) */
function heat(b) { return `hsl(${clamp((b - 20) * 1.4, 0, 225).toFixed(0)} 68% var(--heat-l))`; }
function spreadText(f) {
  const parts = STATS.filter(k => f.sp[k]).map(k => `${f.sp[k]} ${SHORT[k]}`);
  return parts.length ? parts.join(' / ') : 'no stat points';
}
function commonSet(f) { return `${natureText(f)}, ${spreadText(f)}`; }
function natureText(f) {
  const n = NATURES[f.nature];
  return n ? `${f.nature} (+${SHORT[n[0]]}, \u2212${SHORT[n[1]]})` : (f.nature || 'Neutral');
}

/* collections */
const megaOn = () => state.settings.includeMegas;
function formsOfSpecies(sid) {
  const s = DATA.species[sid]; if (!s) return [];
  return [sid, ...(megaOn() ? s.megas : [])].filter(id => DATA.forms[id]);
}
function currentBatch() { return state.batches.find(b => b.id === state.current) || null; }
function batchFormIds() { const b = currentBatch(); return b ? b.species.flatMap(formsOfSpecies) : []; }
function poolFormIds() {
  return Object.keys(state.pool).filter(id => DATA.forms[id] && (megaOn() || !DATA.forms[id].isMega))
    .sort((a, b) => rankOfForm(a) - rankOfForm(b));
}

  const b = currentBatch();
  if (b && b.species.includes(sid)) return 'batch';

  return '';
}

/* mastery records */
function rec(id, mode) {
  state.cards[id] = state.cards[id] || {};
  return state.cards[id][mode] = state.cards[id][mode] || {box: 0, seen: 0, score: 0, last: 0};
}
function peek(id, mode) { return state.cards[id]?.[mode] || null; }
function level(id) {
  const a = peek(id, 'name'), b = peek(id, 'recall');
  if (!a && !b) return -1;
  const boxes = [a, b].filter(Boolean).map(r => r.box);
  return Math.round(boxes.reduce((x, y) => x + y, 0) / boxes.length);

  return seen ? {seen, acc: score / seen} : {seen: 0, acc: null};

function renderStudy(ids, view) {

/* ---------- quiz engine ---------- */
function newQuiz(mode, source, ids) {
  const n = clamp(+state.settings.roundLength || 20, 3, 200);
  ui.quiz = {mode, source, view: state.settings.statView, ids: [...ids], n, i: 0, results: [], recent: [], cur: null, done: false};
  nextQuestion();
}
function pickNext(q) {
  const ids = q.ids;
  if (ids.length === 1) return ids[0];
  const avoid = new Set(q.recent.slice(-Math.min(3, ids.length - 1)));
  const w = ids.map(id => {
    if (avoid.has(id)) return 0;
    const r = peek(id, q.mode), box = r ? r.box : 0;
    return Math.pow(6 - box, 2) * (r && r.seen ? 1 : 1.6) * (q.results.some(x => x.id === id && x.score < 1) ? 1.4 : 1);
  });
  const sum = w.reduce((a, b) => a + b, 0);
  let x = Math.random() * sum;
  for (let i = 0; i < ids.length; i++) { x -= w[i]; if (w[i] > 0 && x <= 0) return ids[i]; }
  return ids.find((id, i) => w[i] > 0) || ids[0];
}
function nextQuestion() {
  const q = ui.quiz;
  if (q.i >= q.n) { q.done = true; q.cur = null; return; }
  const id = pickNext(q);
  q.recent.push(id);
  const f = DATA.forms[id];
  const cur = {id, answered: false, hint: false};
  if (q.mode === 'name' && state.settings.answerStyle === 'choice') cur.choices = makeChoices(f, q);
  if (q.mode === 'recall') {
    const others = ['hp','atk','def','spa','spd'];
    cur.other = others.includes(state.settings.recallStat) ? state.settings.recallStat : others[Math.floor(Math.random() * others.length)];
  }
  q.cur = cur;
}
function makeChoices(f, q) {
  const target = statsOf(f, q.view);
  const dist = g => { const s = statsOf(g, q.view); return STATS.reduce((a, k) => a + Math.abs(s[k] - target[k]), 0); };
  let pool = q.ids.filter(id => id !== f.id).map(id => DATA.forms[id]);
  if (pool.length < 6) pool = pool.concat(Object.values(DATA.forms).filter(g => g.id !== f.id && !q.ids.includes(g.id)));
  pool.sort((a, b) => dist(a) - dist(b));
  const decoys = shuffle(pool.slice(0, 7)).slice(0, 3);
  return shuffle([f.id, ...decoys.map(g => g.id)]);
}
function record(q, score, extra) {
  const id = q.cur.id, now = Date.now(), k0 = dayKey();
  q.cur.undo = {prevRec: state.cards[id]?.[q.mode] ? {...state.cards[id][q.mode]} : null, prevDay: state.days[k0] ? {...state.days[k0]} : null, k: k0, t: now};
  const r = rec(id, q.mode);
  r.seen++; r.score += score; r.last = now;
  if (score >= 0.75) r.box = Math.min(5, r.box + 1);
  else if (score < 0.5) r.box = 0;
  const k = dayKey();
  state.days[k] = state.days[k] || {n: 0, s: 0};
  state.days[k].n++; state.days[k].s += score;
  state.log.push({t: now, m: q.mode, f: id, v: q.view, s: score, ...extra});
  if (state.log.length > 8000) state.log.splice(0, state.log.length - 8000);
  q.results.push({id, score, t: now, ...extra});
  q.cur.answered = true; q.cur.score = score; q.cur.extra = extra;
  persist();
}
function submitName(guessText, guessId) {
  const q = ui.quiz; if (!q || !q.cur || q.cur.answered) return;
  const f = DATA.forms[q.cur.id];
  const g = guessId ? DATA.forms[guessId] : findForm(guessText);
  const typed = String(guessText || '').trim();
  if (!g) {
    const err = $('#qerr');
    const msg = typed ? `\u201c${typed}\u201d isn\u2019t a Pok\u00e9mon in this app\u2019s list, so it wasn\u2019t counted. Keep typing or pick one from the suggestions.` : 'Type a name, or pick one from the suggestions.';
    if (err) err.textContent = msg; else toast(msg);
    $('#qguess')?.focus();
    return;
  }
  const right = g && g.id === f.id;
  const score = right ? (q.cur.hint ? 0.5 : 1) : 0;
  q.cur.guessText = guessText;
  record(q, score, {g: g.id, h: q.cur.hint ? 1 : 0});

function removeAnswer(t, f) {
  const i = state.log.findIndex(r => r.t === t && r.f === f); if (i < 0) return;
  const r = state.log[i]; state.log.splice(i, 1);
  const k = dayKey(new Date(r.t)), d = state.days[k];
  if (d) { d.n--; d.s -= r.s; if (d.n <= 0) delete state.days[k]; }
  const c = state.cards[r.f]?.[r.m];
  if (c) {
    c.seen--; c.score -= r.s;
    let box = 0, last = 0;
    state.log.filter(x => x.f === r.f && x.m === r.m).forEach(x => { if (x.s >= 0.75) box = Math.min(5, box + 1); else if (x.s < 0.5) box = 0; last = x.t; });

function typesProgress() {
  const L = state.log.filter(r => String(r.f).startsWith('t:'));
  if (!L.length) return `<div class="box section"><h3>Types</h3><p class="muted">Your type drills show up here once you play a round in the Types tab.</p></div>`;
  const by = m => { const x = L.filter(r => r.m === m); return x.length ? `${pct(x.reduce((a, r) => a + r.s, 0) / x.length)} <span class="small muted">of ${x.length}</span>` : '\u2013'; };
  const weak = Object.keys(TCARDS).map(id => ({id, ...tAccuracy(id)})).filter(x => x.seen >= 2).sort((a, b) => a.acc - b.acc || b.seen - a.seen).slice(0, 6);
  const mult = L.filter(r => r.m === 'tmult' && r.s < 1);
  const pairs = {}; mult.forEach(r => { const k = r.a + '>' + r.f; pairs[k] = (pairs[k] || 0) + 1; });
  const topPairs = Object.entries(pairs).sort((a, b) => b[1] - a[1]).slice(0, 5);
  return `<div class="two section">
    <div class="box"><h3>Types</h3>
      ${Object.entries(TMODES).map(([m, l]) => `<div class="prow" style="grid-template-columns:1fr auto"><span>${l}</span><span class="r">${by(m)}</span></div>`).join('')}
      ${topPairs.length ? `<h3 style="margin-top:16px">Multipliers you miss most</h3>${topPairs.map(([k, n]) => { const [a, id] = k.split('>'); const c = TCARDS[id]; return c ? `<div class="prow" style="grid-template-columns:auto minmax(0,1fr) auto">${typePill(a)}<span class="small muted">into ${esc(typingName(c))}, it\u2019s ${MULT_LABEL[effOn(a, c.types)]}</span><span class="r">${n}\u00d7</span></div>` : ''; }).join('')}` : ''}
    </div>
    <div class="box"><h3>Type cards that need work</h3>
      ${weak.length ? `<div class="rows">${weak.map(w => { const c = TCARDS[w.id]; return `<div class="prow" style="grid-template-columns:auto minmax(0,1fr) auto"><span class="types">${c.types.map(t => typePill(t)).join('')}</span><span class="small muted">${w.seen} answers</span><span class="r ${w.acc < .5 ? 'res-bad' : w.acc < .8 ? 'res-mid' : 'res-good'}">${pct(w.acc)}</span></div>`; }).join('')}</div>
        <div class="qnext"><button class="btn primary" data-act="tdrill-weak" data-v="tmatch">Drill their matchups</button><button class="btn" data-act="tdrill-weak" data-v="tmult">Drill multipliers</button></div>`
        : '<p class="muted">Answer each card at least twice to see which ones trip you up.</p>'}
    </div></div>`;
}

Pull the current top 100 Pok\u00e9mon from the Pok\u00e9mon Champions ranked ladder (Doubles) and reply with JSON only, shaped like this:
{"meta":{"title":"...","season":"...","format":"Doubles","regulation":"...","source":"...","sourceUrl":"...","updated":"YYYY-MM-DD","pulled":"YYYY-MM-DD","megaRule":"..."},

function openImport() {
  openModal(`<h2 class="qtitle">Update usage data</h2>
    <p class="muted">Paste either a full snapshot in the app\u2019s JSON format, or just a list of names in rank order, one per line. A plain list re-ranks Pok\u00e9mon the app already knows. New names need the JSON format so their stats come along.</p>
    <p class="small">The easiest route: copy the request below, send it to Claude, and paste the reply here.</p>
    <div class="qnext" style="margin:6px 0 14px"><button class="btn" data-act="copy-prompt">Copy the refresh request</button></div>
    <textarea id="import-text" placeholder="Paste JSON or a list of names" aria-label="Usage data to import" data-autofocus></textarea>
    <div class="qnext"><button class="btn primary" data-act="import-apply">Apply</button><button class="btn ghost" data-act="close-modal">Cancel</button></div>
    <div id="import-msg" class="small" style="margin-top:10px"></div>`, 'narrow');
}
function applyImport(text) {
  const msg = t => { $('#import-msg').innerHTML = t; };
  text = String(text || '').trim();
  if (!text) { msg('Paste something first.'); return; }
  let obj = null;
  try { obj = JSON.parse(text.replace(/^```(json)?|```$/g, '').trim()); } catch (e) { /* not JSON */ }
  const known = {};
  [...BUILTIN.rows, ...(state.usage.extra || []), ...state.usage.rows].forEach(r => { known[r[1]] = r; });
  let rows, meta = {...state.usage.meta}, missing = [];
  if (obj) {
    const list = Array.isArray(obj) ? obj : obj.rows;
    if (!Array.isArray(list) || !list.length) { msg('That JSON has no rows.'); return; }
    rows = list.map((r, i) => Array.isArray(r) ? r : [r.rank ?? i + 1, r.id, r.name, r.dex, r.art, Array.isArray(r.types) ? r.types.join('/') : r.types, Array.isArray(r.base) ? r.base.join('/') : r.base, r.nature, Array.isArray(r.sp) ? r.sp.join('/') : r.sp, r.item, r.megas]);
    const bad = rows.filter(r => !r[1] || !r[2] || String(r[6]).split('/').length !== 6);
    if (bad.length) { msg(`Some rows are missing an id, a name or six base stats (first one: ${esc(JSON.stringify(bad[0]).slice(0, 80))}).`); return; }
    if (obj.meta) meta = {...meta, ...obj.meta};
    else meta = {...meta, updated: dayKey(), pulled: dayKey()};
  } else {
    const names = text.split(/\r?\n/).map(l => l.replace(/^\s*#?\d+[.)\-:\s]+/, '').replace(/\s+\d+(\.\d+)?%.*$/, '').trim()).filter(Boolean);
    rows = [];
    names.forEach(n => {
      const f = findForm(n); const sid = f ? f.speciesId : null;
      const r = sid && known[sid];
      if (r && !rows.some(x => x[1] === sid)) rows.push(r.map((v, i) => i === 0 ? rows.length + 1 : v));
      else if (!r) missing.push(n);
    });
    if (!rows.length) { msg('None of those names matched a Pok\u00e9mon the app knows.'); return; }
    meta = {...meta, updated: dayKey(), pulled: dayKey(), source: (meta.source || '') + ' (re-ranked from a pasted list)'};
  }
  rows.sort((a, b) => a[0] - b[0]);
  const ids = new Set(rows.map(r => r[1]));
  const extra = Object.values(known).filter(r => !ids.has(r[1]));
  state.usage = {meta, rows, extra};
  rebuild(); persist(); closeModal(); render();
  toast(`Usage data updated: ${rows.length} Pok\u00e9mon${missing.length ? `, ${missing.length} name${missing.length > 1 ? 's' : ''} skipped` : ''}.`, 4000);
  if (missing.length) setTimeout(() => toast(`Skipped: ${missing.slice(0, 6).join(', ')}${missing.length > 6 ? '\u2026' : ''}`, 5000), 4100);
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast('Copied. Paste it into a chat with Claude.'); }
  catch (e) {
    const ta = $('#import-text');
    if (ta) { ta.value = text; ta.select(); toast('Copy blocked by the browser. The request is in the box, select it and copy.', 4000); }
  }
}
