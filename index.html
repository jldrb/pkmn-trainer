const IDB = {
  open() { return new Promise((res, rej) => { const r = indexedDB.open('champions-stat-trainer', 1); r.onupgradeneeded = () => r.result.createObjectStore('h'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async get(k) { try { const db = await this.open(); return await new Promise((res, rej) => { const t = db.transaction('h').objectStore('h').get(k); t.onsuccess = () => res(t.result); t.onerror = () => rej(t.error); }); } catch (e) { return null; } },
  async set(k, v) { try { const db = await this.open(); await new Promise((res, rej) => { const t = db.transaction('h', 'readwrite'); t.objectStore('h').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); } catch (e) { /* ignore */ } },
  async del(k) { try { const db = await this.open(); await new Promise(res => { const t = db.transaction('h', 'readwrite'); t.objectStore('h').delete(k); t.oncomplete = res; t.onerror = res; }); } catch (e) { /* ignore */ } }
};
async function initFileLink() {
  if (!FS_OK) return;
  const h = await IDB.get('save'); if (!h) return;
  fileLink.handle = h;
  try { fileLink.status = (await h.queryPermission({mode: 'readwrite'})) === 'granted' ? 'linked' : 'needs-permission'; }
  catch (e) { fileLink.status = 'needs-permission'; }
  renderRailFoot(); if (state.ui.panel === 'save') render();
}
let writeTimer = null;
function scheduleFileWrite() { if (fileLink.status !== 'linked') return; clearTimeout(writeTimer); writeTimer = setTimeout(writeFileNow, 700); }
async function writeFileNow() {
  if (!fileLink.handle) return;
  try { const w = await fileLink.handle.createWritable(); await w.write(saveJSON()); await w.close(); fileLink.lastWrite = Date.now(); }
  catch (e) { console.warn(e); fileLink.status = 'needs-permission'; renderRailFoot(); }
}
async function linkFile() {
  try {
    const h = await window.showSaveFilePicker({suggestedName: 'champions-stat-trainer-save.json', types: [{description: 'Save file', accept: {'application/json': ['.json']}}]});
    fileLink.handle = h; fileLink.status = 'linked'; await IDB.set('save', h); await writeFileNow();
    toast(`Linked. Progress now also saves to ${h.name}.`);
  } catch (e) { if (e && e.name !== 'AbortError') toast('Could not link that file: ' + e.message); }
  render();
}
async function reconnectFile() {
  if (!fileLink.handle) return;
  try {
    if ((await fileLink.handle.requestPermission({mode: 'readwrite'})) === 'granted') { fileLink.status = 'linked'; await writeFileNow(); toast('Save file reconnected.'); }
  } catch (e) { toast('Permission was not granted.'); }
  render();
}
async function unlinkFile() { fileLink.handle = null; fileLink.status = FS_OK ? 'none' : 'unsupported'; await IDB.del('save'); render(); toast('Save file unlinked. Progress still autosaves in this browser.'); }
function exportSave() {
  const blob = new Blob([saveJSON()], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `champions-stat-trainer-${dayKey()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast('Save file downloaded.');
}
function importSaveText(text) {
  let obj;
  try { obj = JSON.parse(text); } catch (e) { toast('That file isn\u2019t valid JSON.'); return false; }
  const s = obj && obj.state ? obj.state : obj;
  if (!s || !s.settings || !s.usage) { toast('That doesn\u2019t look like a Champions Stat Trainer save file.'); return false; }
  if (!confirm('Load this save file? It replaces the progress stored in this browser.')) return false;
  state = migrate(s); ui.quiz = null; ui.tquiz = null; rebuild(); applyTheme(); persist(); render();
  toast(`Save loaded: ${Object.keys(state.pool).length} cards in history, ${state.log.length} answers.`);
  return true;
}

/* =========================================================
   Types: chart (Gen 6+, same in Champions), cards, three drills
   ========================================================= */
const TYPES = ['Normal','Fire','Water','Electric','Grass','Ice','Fighting','Poison','Ground','Flying','Psychic','Bug','Rock','Ghost','Dragon','Dark','Steel','Fairy'];
const CHART_SRC = {
  Normal:   {se: [], nve: ['Rock','Steel'], no: ['Ghost']},
  Fire:     {se: ['Grass','Ice','Bug','Steel'], nve: ['Fire','Water','Rock','Dragon'], no: []},
  Water:    {se: ['Fire','Ground','Rock'], nve: ['Water','Grass','Dragon'], no: []},
  Electric: {se: ['Water','Flying'], nve: ['Electric','Grass','Dragon'], no: ['Ground']},
  Grass:    {se: ['Water','Ground','Rock'], nve: ['Fire','Grass','Poison','Flying','Bug','Dragon','Steel'], no: []},
  Ice:      {se: ['Grass','Ground','Flying','Dragon'], nve: ['Fire','Water','Ice','Steel'], no: []},
  Fighting: {se: ['Normal','Ice','Rock','Dark','Steel'], nve: ['Poison','Flying','Psychic','Bug','Fairy'], no: ['Ghost']},
  Poison:   {se: ['Grass','Fairy'], nve: ['Poison','Ground','Rock','Ghost'], no: ['Steel']},
  Ground:   {se: ['Fire','Electric','Poison','Rock','Steel'], nve: ['Grass','Bug'], no: ['Flying']},
  Flying:   {se: ['Grass','Fighting','Bug'], nve: ['Electric','Rock','Steel'], no: []},
  Psychic:  {se: ['Fighting','Poison'], nve: ['Psychic','Steel'], no: ['Dark']},
  Bug:      {se: ['Grass','Psychic','Dark'], nve: ['Fire','Fighting','Poison','Flying','Ghost','Steel','Fairy'], no: []},
  Rock:     {se: ['Fire','Ice','Flying','Bug'], nve: ['Fighting','Ground','Steel'], no: []},
  Ghost:    {se: ['Psychic','Ghost'], nve: ['Dark'], no: ['Normal']},
  Dragon:   {se: ['Dragon'], nve: ['Steel'], no: ['Fairy']},
  Dark:     {se: ['Psychic','Ghost'], nve: ['Fighting','Dark','Fairy'], no: []},
  Steel:    {se: ['Ice','Rock','Fairy'], nve: ['Fire','Water','Electric','Steel'], no: []},
  Fairy:    {se: ['Fighting','Dragon','Dark'], nve: ['Fire','Poison','Steel'], no: []}
};
const EFF = {};
TYPES.forEach(a => { EFF[a] = {}; TYPES.forEach(d => EFF[a][d] = 1); const s = CHART_SRC[a]; s.se.forEach(d => EFF[a][d] = 2); s.nve.forEach(d => EFF[a][d] = 0.5); s.no.forEach(d => EFF[a][d] = 0); });
const effOn = (atk, defTypes) => defTypes.reduce((m, d) => m * EFF[atk][d], 1);
const MULTS = [0, 0.25, 0.5, 1, 2, 4];
const MULT_LABEL = {0: '0\u00d7', 0.25: '\u00bc\u00d7', 0.5: '\u00bd\u00d7', 1: '1\u00d7', 2: '2\u00d7', 4: '4\u00d7'};
const TMODES = {tname: 'Name the type', tmatch: 'Matchups from type', tmult: 'Damage multiplier'};
const TCAT = {
  se:     {label: 'Super effective against', q: c => `Which types do ${c.types[0]} moves hit super effectively?`},
  nve:    {label: 'Not very effective against', q: c => `Which types resist ${c.types[0]} moves?`},
  no:     {label: 'No effect on', q: c => `Which types are immune to ${c.types[0]} moves?`},
  weak:   {label: 'Weak to', q: c => `Which attacking types are super effective against ${typingName(c)}?`},
  resist: {label: 'Resists', q: c => `Which attacking types does ${typingName(c)} resist?`},
  immune: {label: 'Immune to', q: c => `Which attacking types can\u2019t hit ${typingName(c)} at all?`}
};
const typingName = c => c.types.join('/');

let TCARDS = {};
function buildTypeCards() {
  const cards = {};
  TYPES.forEach((t, i) => { const id = 't:' + norm(t); cards[id] = {id, types: [t], dual: false, mons: [], order: i}; });
  DATA.ranking.forEach(sid => {
    const s = DATA.species[sid]; if (!s) return;
    [sid, ...s.megas].forEach(fid => {
      const f = DATA.forms[fid]; if (!f) return;
      const id = 't:' + f.types.map(norm).sort().join('-');
      if (!cards[id]) cards[id] = {id, types: [...f.types], dual: f.types.length > 1, mons: [], order: 100 + (s.rank || 999)};
      if (!cards[id].mons.includes(f.name)) cards[id].mons.push(f.name);
    });
  });
  TCARDS = cards;
}
function defProfile(types) { const o = {}; TYPES.forEach(a => o[a] = effOn(a, types)); return o; }
function cardSets(c) {
  const dp = defProfile(c.types);
  const s = {dp, weak: TYPES.filter(a => dp[a] > 1), resist: TYPES.filter(a => dp[a] > 0 && dp[a] < 1), immune: TYPES.filter(a => dp[a] === 0)};
  if (!c.dual) { const t = c.types[0]; s.se = TYPES.filter(d => EFF[t][d] === 2); s.nve = TYPES.filter(d => EFF[t][d] === 0.5); s.no = TYPES.filter(d => EFF[t][d] === 0); }
  else s.stab = TYPES.filter(d => c.types.some(t => EFF[t][d] === 2));
  return s;
}
function typePool(src) {
  const all = Object.values(TCARDS).sort((a, b) => a.order - b.order);
  return src === 'single' ? all.filter(c => !c.dual) : src === 'dual' ? all.filter(c => c.dual) : all;
}
function tAccuracy(id) {
  let seen = 0, score = 0;
  Object.keys(TMODES).forEach(m => { const r = peek(id, m); if (r) { seen += r.seen; score += r.score; } });
  return seen ? {seen, acc: score / seen} : {seen: 0, acc: null};
}
function tLevel(id) {
  const rs = Object.keys(TMODES).map(m => peek(id, m)).filter(Boolean);
  return rs.length ? Math.round(rs.reduce((a, r) => a + r.box, 0) / rs.length) : -1;
}

/* ---------- rendering pieces ---------- */
function typePill(t, extra = '', big = false) {
  const c = TYPE_COLOR[t] || '#888';
  return `<span class="type ${big ? 'tbig' : ''}" style="--t:${c};--tc:${textOn(c)}">${esc(t)}${extra ? `<span class="x">${extra}</span>` : ''}</span>`;
}
function pillList(list, dp, kind) {
  if (!list.length) return '<span class="none">None</span>';
  return `<span class="types">${list.map(t => typePill(t, dp && kind === 'weak' && dp[t] === 4 ? '4\u00d7' : dp && kind === 'resist' && dp[t] === 0.25 ? '\u00bc' : '')).join('')}</span>`;
}
function trows(c, sets, keys) {
  return keys.map(k => `<div class="trow"><span class="tl">${TCAT[k].label}</span>${pillList(sets[k], c.dual ? sets.dp : null, k)}</div>`).join('');
}
function profileHTML(c, sets) {
  return `${c.dual ? '' : `<div class="tsec"><h4>Attacking with ${esc(c.types[0])} moves</h4>${trows(c, sets, ['se', 'nve', 'no'])}</div>`}
    <div class="tsec"><h4>Defending${c.dual ? ' (4\u00d7 and \u00bc marked)' : ''}</h4>${trows(c, sets, ['weak', 'resist', 'immune'])}</div>`;
}
function typeCard(c) {
  const sets = cardSets(c);
  const lvl = tLevel(c.id);
  return `<div class="tcard">
    <div class="tc-head"><span class="types">${c.types.map(t => typePill(t, '', true)).join('')}</span>${lvl >= 0 ? `<span class="tc-lvl">${lvl >= 5 ? 'Mastered' : 'Box ' + lvl}</span>` : ''}</div>
    ${c.mons.length ? `<div class="tc-mons">${c.dual ? '' : 'Pure type in the top 100: '}${esc(c.mons.slice(0, 6).join(', '))}${c.mons.length > 6 ? `, +${c.mons.length - 6} more` : ''}</div>` : ''}
    ${profileHTML(c, sets)}
    ${c.dual ? `<div class="tsec"><h4>Its STAB moves</h4><div class="trow"><span class="tl">Super effective against</span>${pillList(sets.stab)}</div></div>` : ''}
  </div>`;
}

/* ---------- panel ---------- */
function renderTypes() {
  if (!Object.keys(TCARDS).length) buildTypeCards();
  const src = state.ui.typesSource || 'single', mode = state.ui.typesMode || 'study';
  const nS = typePool('single').length, nD = typePool('dual').length;
  const custom = ui.tquiz && ui.tquiz.source === 'custom';
  const lede = {study: 'Every type\u2019s matchups. Dual typings come from the Pok\u00e9mon in the current top 100, Megas included.',
    tname: 'You see the matchups, you name the type.', tmatch: 'You see the type, you pick every type that fits the question.',
    tmult: 'One attacking type into one typing: pick the damage multiplier.'}[mode];
  const head = `<div class="panel-head"><div><h1>Types</h1><p class="lede">${lede}</p></div></div>
  <div class="trainbar">
    <div class="cgroup"><span class="label">Cards from</span>${seg('types-source', [['single', `Single types (${nS})`], ['dual', `Dual typings (${nD})`], ['all', `All (${nS + nD})`]], custom ? '' : src)}</div>
    <div class="cgroup"><span class="label">Mode</span>${seg('types-mode', [['study', 'Study'], ['tname', 'Name the type'], ['tmatch', 'Matchups from type'], ['tmult', 'Damage multiplier']], mode)}</div>
  </div>`;
  const pool = typePool(src);
  if (mode === 'study') return head + renderTypeStudy(pool);
  const q = ui.tquiz;
  const active = q && q.mode === mode && (q.source === src || q.source === 'custom');
  if (!active) return head + `<div class="start"><div class="qcard">
    <h2 class="qtitle">${TMODES[mode]}</h2>
    <p class="qnote">${{tname: `Each question shows the matchups of a single type or a dual typing. Pick one type, or two for a dual typing. Any typing with exactly those matchups counts.`,
      tmatch: `Each question asks one thing about a type: what it hits super effectively, what resists it, what it\u2019s weak to, and so on. Tap every type that fits, or None. All correct scores a full point, off by one scores half.`,
      tmult: `Each question is one attacking type into a single type or a dual typing. Pick 0, \u00bc, \u00bd, 1, 2 or 4\u00d7 (keys 1 to 6 work too). Most questions are not neutral, so you practise the matchups that matter.`}[mode]}
      A round has ${state.settings.roundLength} questions from ${pool.length} cards, and cards you miss come back more often.</p>
    <div class="opts"><label class="inline">Round length <input type="number" min="3" max="200" value="${state.settings.roundLength}" data-setting="roundLength" style="width:76px"></label></div>
    <button class="btn primary" data-act="tquiz-start">Start round</button></div></div>`;
  if (q.done) return head + renderTSummary(q);
  return head + renderTQuestion(q);
}
function renderTypeStudy(pool) {
  const qy = norm(ui.typesQuery || '');
  const sort = state.ui.typesSort || 'chart';
  let cards = pool.filter(c => !qy || c.types.some(t => norm(t).includes(qy)) || c.mons.some(m => norm(m).includes(qy)));
  const nWeak = c => cardSets(c).weak.length;
  if (sort === 'weak') cards = [...cards].sort((a, b) => nWeak(b) - nWeak(a) || a.order - b.order);
  if (sort === 'mastery') cards = [...cards].sort((a, b) => tLevel(a.id) - tLevel(b.id) || a.order - b.order);
  return `<div class="toolbar">
    <div class="grow"><input type="search" placeholder="Filter by type or Pok\u00e9mon" value="${esc(ui.typesQuery || '')}" data-input="types-q" aria-label="Filter type cards"></div>
    <label class="inline">Sort <select data-input="types-sort" aria-label="Sort type cards">${[['chart', 'Chart order, then usage'], ['weak', 'Most weaknesses first'], ['mastery', 'Least mastered first']].map(([v, l]) => `<option value="${v}" ${sort === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
  </div>
  <div class="grid" id="type-grid">${cards.map(typeCard).join('') || '<div class="empty"><p>No cards match that filter.</p></div>'}</div>`;
}

/* ---------- quiz engine (shares record / undo / scheduling with the Pokémon quizzes) ---------- */
function tNewQuiz(mode, source, ids) {
  ui.tquiz = {kind: 'type', mode, source, view: 'type', ids: [...ids], n: clamp(+state.settings.roundLength || 20, 3, 200), i: 0, results: [], recent: [], cur: null, done: false};
  tNextQuestion(ui.tquiz);
}
function tNextQuestion(q) {
  if (q.i >= q.n) { q.done = true; q.cur = null; return; }
  const id = pickNext(q); q.recent.push(id);
  const c = TCARDS[id], sets = cardSets(c);
  const cur = {id, answered: false, picks: []};
  if (q.mode === 'tmatch') {
    const cats = c.dual ? ['weak', 'resist', 'immune'] : ['se', 'nve', 'no', 'weak', 'resist', 'immune'];
    const w = cats.map(k => sets[k].length ? 1 : 0.3), sum = w.reduce((a, b) => a + b, 0);
    let x = Math.random() * sum; cur.cat = cats[cats.length - 1];
    for (let i = 0; i < cats.length; i++) { x -= w[i]; if (x <= 0) { cur.cat = cats[i]; break; } }
  }
  if (q.mode === 'tmult') {
    const non = TYPES.filter(a => sets.dp[a] !== 1), neu = TYPES.filter(a => sets.dp[a] === 1);
    const from = (Math.random() < 0.72 && non.length) || !neu.length ? non : neu;
    cur.atk = from[Math.floor(Math.random() * from.length)];
  }
  q.cur = cur;
}
function tTogglePick(t) {
  const q = ui.tquiz; if (!q || !q.cur || q.cur.answered) return;
  const c = TCARDS[q.cur.id], p = q.cur.picks;
  if (t === 'None') { q.cur.picks = p[0] === 'None' ? [] : ['None']; }
  else {
    const i = p.indexOf(t);
    if (i >= 0) p.splice(i, 1);
    else {
      if (p[0] === 'None') p.length = 0;
      p.push(t);
      if (q.mode === 'tname') { const max = c.dual ? 2 : 1; while (p.length > max) p.shift(); }
    }
  }
  const y = window.scrollY; render(); window.scrollTo(0, y);
}
function tSubmit(value) {
  const q = ui.tquiz; if (!q || !q.cur || q.cur.answered) return;
  const c = TCARDS[q.cur.id], sets = cardSets(c), cur = q.cur;
  if (q.mode === 'tname') {
    if (!cur.picks.length) { toast(c.dual ? 'Pick two types first.' : 'Pick a type first.'); return; }
    const a = defProfile(cur.picks), b = sets.dp;
    let same = TYPES.every(t => a[t] === b[t]);
    if (!c.dual) same = cur.picks.length === 1 && cur.picks[0] === c.types[0];
    record(q, same ? 1 : 0, {g: cur.picks.join('/')});
  } else if (q.mode === 'tmatch') {
    if (!cur.picks.length) { toast('Tap the types that fit, or None.'); return; }
    const want = new Set(sets[cur.cat]), got = new Set(cur.picks.filter(t => t !== 'None'));
    const missed = [...want].filter(t => !got.has(t)), extra = [...got].filter(t => !want.has(t));
    const d = missed.length + extra.length;
    record(q, d === 0 ? 1 : d === 1 ? 0.5 : 0, {c: cur.cat, g: cur.picks.join('/'), mi: missed.join('/'), ex: extra.join('/')});
  } else {
    const right = effOn(cur.atk, c.types);
    record(q, value === right ? 1 : 0, {a: cur.atk, g: value, r: right});
  }
  render(); afterQuizRender();
}
function tPicker(q, c) {
  const cur = q.cur, ans = cur.answered;
  const btn = t => { const col = TYPE_COLOR[t] || '#888'; return `<button type="button" class="tpick" style="--t:${col};--tc:${textOn(col)}" data-act="tpick" data-t="${t}" aria-pressed="${cur.picks.includes(t)}" ${ans ? 'disabled' : ''}>${t}</button>`; };
  return `<div class="tpicker">${TYPES.map(btn).join('')}${q.mode === 'tmatch' ? `<button type="button" class="tpick none" data-act="tpick" data-t="None" aria-pressed="${cur.picks.includes('None')}" ${ans ? 'disabled' : ''}>None</button>` : ''}</div>
    ${ans ? '' : `<div class="qnext"><button class="btn primary" data-act="tquiz-check">Check</button><span class="kbdhint">${q.mode === 'tname' ? (c.dual ? 'Pick two types' : 'Pick one type') : 'Tap all that apply'}, then Enter</span></div>`}`;
}
function tNext(q) {
  return `<div class="qnext"><button class="btn primary" id="qnext" data-act="quiz-next">${q.i + 1 >= q.n ? 'See results' : 'Next question'}</button><span class="kbdhint">or press Enter</span><button class="btn ghost sm" data-act="quiz-undo" style="margin-left:auto" title="Ctrl+Z also works">Undo, I misclicked</button></div>`;
}
function renderTQuestion(q) {
  const c = TCARDS[q.cur.id], sets = cardSets(c), cur = q.cur, ans = cur.answered;
  const cls = ans ? (cur.score >= 1 ? 'good' : cur.score > 0 ? 'mid' : 'bad') : '';
  const bigTyping = `<span class="types">${c.types.map(t => typePill(t, '', true)).join('')}</span>`;
  const mons = c.mons.length ? `<p class="qnote" style="margin:8px 0 0">${c.dual ? 'Like' : 'Pure type in the top 100:'} ${esc(c.mons.slice(0, 4).join(', '))}${c.mons.length > 4 ? ', \u2026' : ''}</p>` : '';
  let body = '', fb = '';
  if (q.mode === 'tname') {
    body = `<h2 class="qtitle">Which ${c.dual ? 'dual typing' : 'type'} has these matchups?</h2>
      <p class="qnote">${c.dual ? 'Defensive matchups of a dual typing. Pick both types.' : 'A single type, attacking and defending. Pick one type.'}</p>
      <div class="tprofile">${profileHTML(c, sets)}</div>${tPicker(q, c)}`;
    if (ans) fb = `<div class="fb ${cls}"><div class="fb-title">${cur.score >= 1 ? 'Correct' : `It was ${typingName(c)}`}</div>
      <div style="margin-top:8px">${bigTyping}</div>${mons}${cur.score < 1 ? `<p class="small" style="margin:8px 0 0">You picked ${esc(cur.picks.join('/'))}.</p>` : ''}</div>${tNext(q)}`;
  } else if (q.mode === 'tmatch') {
    body = `<div style="margin-bottom:10px">${bigTyping}</div>${mons}
      <h2 class="qtitle" style="margin-top:14px">${esc(TCAT[cur.cat].q(c))}</h2>
      <p class="qnote">Tap every type that fits${c.dual && cur.cat === 'weak' ? ', 4\u00d7 weaknesses included' : c.dual && cur.cat === 'resist' ? ', \u00bc resistances included' : ''}. Choose None if nothing does.</p>${tPicker(q, c)}`;
    if (ans) {
      const e = cur.extra, list = s => s ? s.split('/').map(t => typePill(t)).join('') : '';
      fb = `<div class="fb ${cls}"><div class="fb-title">${cur.score >= 1 ? 'All correct' : cur.score > 0 ? 'Off by one' : 'Not this time'}</div>
        <div class="trow" style="border-top:0"><span class="tl">Answer</span>${pillList(sets[cur.cat], c.dual ? sets.dp : null, cur.cat)}</div>
        ${e.mi ? `<div class="trow"><span class="tl">You missed</span><span class="types">${list(e.mi)}</span></div>` : ''}
        ${e.ex ? `<div class="trow"><span class="tl">Shouldn\u2019t be there</span><span class="types">${list(e.ex)}</span></div>` : ''}
        <details style="margin-top:10px"><summary class="small">Full card</summary><div class="tprofile" style="margin-top:8px">${profileHTML(c, sets)}</div></details></div>${tNext(q)}`;
    }
  } else {
    const right = effOn(cur.atk, c.types);
    body = `<div class="multq">${typePill(cur.atk, '', true)}<span class="muted">move into</span>${bigTyping}</div>${mons}
      <h2 class="qtitle" style="margin-top:14px">How much damage does it do?</h2>
      <div class="mchoices">${MULTS.map((m, i) => {
        let k = '';
        if (ans) { if (m === right) k = 'is-right'; else if (m === cur.extra.g) k = 'is-wrong'; }
        return `<button type="button" class="choice mchoice ${k}" data-act="tmult" data-v="${m}" ${ans ? 'disabled' : ''}><span class="key">${i + 1}</span>${MULT_LABEL[m]}</button>`;
      }).join('')}</div>`;
    if (ans) {
      const parts = c.types.map(t => `on ${t} is ${MULT_LABEL[EFF[cur.atk][t]]}`).join(' and ');
      fb = `<div class="fb ${cls}"><div class="fb-title">${cur.score >= 1 ? 'Correct' : `It\u2019s ${MULT_LABEL[right]}`}</div>
        <p style="margin:6px 0 0">${esc(cur.atk)} ${parts}${c.dual ? `, so ${MULT_LABEL[right]} in total` : ''}.</p></div>${tNext(q)}`;
    }
  }
  return `<div class="quiz"><div class="qcard">${qHead(q)}${body}${fb}</div></div>`;
}
function renderTSummary(q) {
  const n = q.results.length;
  if (!n) return `<div class="start"><div class="qcard"><h2 class="qtitle">Round ended</h2><p class="qnote">No answers this time.</p><button class="btn primary" data-act="tquiz-start">Start a round</button></div></div>`;
  const sc = q.results.reduce((a, r) => a + r.score, 0), misses = q.results.filter(r => r.score < 1);
  const row = r => {
    const c = TCARDS[r.id]; if (!c) return '';
    const what = q.mode === 'tname' ? `You picked ${esc(r.g)}` : q.mode === 'tmatch' ? `${TCAT[r.c].label}${r.mi ? `, missed ${esc(r.mi.replace(/\//g, ', '))}` : ''}${r.ex ? `, extra ${esc(r.ex.replace(/\//g, ', '))}` : ''}` : `${esc(r.a)} into it: you said ${MULT_LABEL[r.g]}, it\u2019s ${MULT_LABEL[r.r]}`;
    return `<div class="prow" style="grid-template-columns:auto minmax(0,1fr) auto"><span class="types">${c.types.map(t => typePill(t)).join('')}</span><div class="small muted">${what}</div><span class="r ${r.score > 0 ? 'res-mid' : 'res-bad'}">${pct(r.score)}</span></div>`;
  };
  return `<div class="quiz">
    <h2 class="qtitle" style="font-size:36px;margin-bottom:14px">Round complete</h2>
    <div class="board">
      <div><div class="fig">${pct(sc / n)}</div><div class="cap">Score</div></div>
      <div><div class="fig">${n}</div><div class="cap">Questions answered</div></div>
      <div><div class="fig">${q.results.filter(r => r.score >= 1).length}</div><div class="cap">Full marks</div></div>
      <div><div class="fig">${misses.length}</div><div class="cap">To review</div></div>
    </div>
    <div class="box section" style="margin-top:16px"><h3>${misses.length ? 'To review' : 'Nothing to review, every answer was right'}</h3><div class="rows">${misses.map(row).join('')}</div></div>
    <div class="qnext"><button class="btn primary" data-act="tquiz-start">Another round</button>
      ${misses.length ? '<button class="btn" data-act="tquiz-drill-misses">Drill the misses</button>' : ''}
      <button class="btn ghost" data-act="tquiz-to-study">Back to study</button></div></div>`;
}

/* =========================================================
   Render router
   ========================================================= */
function applyTheme() {
  const t = state.settings.theme;
  if (t === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
}
function render() {
  renderNav(); renderRailFoot();
  const p = state.ui.panel;
  const html = p === 'usage' ? renderUsage() : p === 'batch' ? renderBatch() : p === 'train' ? renderTrain() : p === 'types' ? renderTypes() : p === 'progress' ? renderProgress() : renderSave();
  $('#main').innerHTML = html;
  animateBars($('#main'));
}
/* re-render only a list region so search inputs keep focus */
function renderRegion(id, html) { const el = document.getElementById(id); if (el) el.outerHTML = html; }

/* =========================================================
   Actions
   ========================================================= */
const ACT = {
  nav(el) { state.ui.panel = el.dataset.v; persist(); render(); window.scrollTo(0, 0); },
  'usage-filter'(el) { ui.usageFilter = el.dataset.v; render(); },
  'draft-toggle'(el) {
    const id = el.dataset.id, i = state.draft.indexOf(id);
    if (i >= 0) state.draft.splice(i, 1); else state.draft.push(id);
    persist(); const y = window.scrollY; render(); window.scrollTo(0, y);
  },
  'draft-clear'() { state.draft = []; persist(); render(); },
  'fill-next'() { fillDraft('next'); },
  'fill-weak'() { fillDraft('weak'); },
  'fill-random'() { fillDraft('random'); },
  'batch-start'() { startBatch(false); },
  'batch-extend'() { startBatch(true); },
  'go-train'() { state.ui.panel = 'train'; state.ui.trainSource = 'batch'; state.ui.trainMode = 'study'; persist(); render(); window.scrollTo(0, 0); },
  'train-source'(el) { state.ui.trainSource = el.dataset.v; ui.quiz = null; persist(); render(); },
  'train-mode'(el) { state.ui.trainMode = el.dataset.v; if (ui.quiz && ui.quiz.mode !== el.dataset.v) ui.quiz = null; persist(); render(); },
  'stat-view'(el) { state.settings.statView = el.dataset.v; if (ui.quiz && !ui.quiz.done) ui.quiz = null; persist(); render(); },
  'study-view'(el) { state.ui.studyView = el.dataset.v; persist(); render(); },
  'bar-color'(el) { state.settings.barColor = el.dataset.v; persist(); render(); },
  'open-card'(el) { openCard(el.dataset.id); },
  'close-modal'() { closeModal(); },
  'modal-back'(el, e) { if (e.target === el) closeModal(); },
  'quiz-start'() {
    const q = ui.quiz;
    const ids = q && q.source === 'custom' && !q.done ? q.ids : sourceIds(state.ui.trainSource);
    if (!ids.length) { toast('No cards to quiz on yet.'); return; }
    newQuiz(state.ui.trainMode, state.ui.trainSource, ids); render(); afterQuizRender();
  },
  'quiz-next'() { quizNext(); },
  'quiz-undo'() { undoAnswer(); },
  'types-source'(el) { state.ui.typesSource = el.dataset.v; ui.tquiz = null; persist(); render(); },
  'types-mode'(el) { state.ui.typesMode = el.dataset.v; if (ui.tquiz && ui.tquiz.mode !== el.dataset.v) ui.tquiz = null; persist(); render(); },
  'tquiz-start'() {
    const q = ui.tquiz;
    const ids = q && q.source === 'custom' && !q.done ? q.ids : typePool(state.ui.typesSource || 'single').map(c => c.id);
    tNewQuiz(state.ui.typesMode, state.ui.typesSource || 'single', ids); render(); afterQuizRender();
  },
  'tpick'(el) { tTogglePick(el.dataset.t); },
  'tquiz-check'() { tSubmit(); },
  'tmult'(el) { tSubmit(+el.dataset.v); },
  'tquiz-drill-misses'() {
    const ids = [...new Set(ui.tquiz.results.filter(r => r.score < 1).map(r => r.id))];
    tNewQuiz(ui.tquiz.mode, 'custom', ids); ui.tquiz.n = Math.max(ids.length * 2, 6); render(); afterQuizRender();
  },
  'tquiz-to-study'() { ui.tquiz = null; state.ui.typesMode = 'study'; persist(); render(); },
  'tdrill-weak'(el) {
    const ids = Object.keys(TCARDS).map(id => ({id, ...tAccuracy(id)})).filter(x => x.seen >= 2).sort((a, b) => a.acc - b.acc).slice(0, 6).map(x => x.id);
    if (!ids.length) return;
    state.ui.panel = 'types'; state.ui.typesMode = el.dataset.v;
    tNewQuiz(el.dataset.v, 'custom', ids); ui.tquiz.n = Math.max(ids.length * 2, 8);
    persist(); render(); afterQuizRender(); window.scrollTo(0, 0);
  },
  'remove-answer'(el) { if (confirm('Remove this answer from your history?')) removeAnswer(+el.dataset.t, el.dataset.f); },
  'quiz-hint'() { if (ui.quiz?.cur && !ui.quiz.cur.answered) { ui.quiz.cur.hint = true; render(); afterQuizRender(); } },
  'quiz-choice'(el) { submitName('', el.dataset.id); },
  'quiz-end'() { const q = ui.quiz; if (!q) return; q.done = true; render(); },
  'quiz-drill-misses'() {
    const ids = [...new Set(ui.quiz.results.filter(r => r.score < 1).map(r => r.id))];
    const mode = ui.quiz.mode;
    newQuiz(mode, 'custom', ids); ui.quiz.n = Math.max(ids.length * 2, 6); render(); afterQuizRender();
  },
  'quiz-to-study'() { ui.quiz = null; state.ui.trainMode = 'study'; persist(); render(); },
  'drill-weak'(el) {
    const pool = poolFormIds().map(id => ({id, ...accuracyOf(id)})).filter(x => x.seen >= 2).sort((a, b) => a.acc - b.acc).slice(0, 8).map(x => x.id);
    if (!pool.length) return;
    state.ui.panel = 'train'; state.ui.trainMode = el.dataset.v;
    newQuiz(el.dataset.v, 'custom', pool); ui.quiz.n = Math.max(pool.length * 2, 8);
    persist(); render(); afterQuizRender(); window.scrollTo(0, 0);
  },
  'set-answer'(el) { state.settings.answerStyle = el.dataset.v; if (ui.quiz && !ui.quiz.done) ui.quiz = null; persist(); render(); },
  'set-name'(el) { state.settings.nameInRecall = el.dataset.v === '1'; persist(); render(); },
  'set-megas'(el) { state.settings.includeMegas = el.dataset.v === '1'; ui.quiz = null; persist(); render(); },
  'set-theme'(el) { state.settings.theme = el.dataset.v; applyTheme(); persist(); render(); },
  'save-export'() { exportSave(); },
  'save-import'() { const fi = $('#file-in'); fi.value = ''; fi.click(); },
  'save-link'() { linkFile(); },
  'save-reconnect'() { reconnectFile(); },
  'save-unlink'() { unlinkFile(); },
  'open-import'() { openImport(); },
  'import-apply'() { applyImport($('#import-text').value); },
  'copy-prompt'() { copyText(REFRESH_PROMPT()); },
  'usage-restore'() {
    if (!confirm('Replace the current usage data with the snapshot built into this app?')) return;
    state.usage = {meta: {...BUILTIN.meta}, rows: BUILTIN.rows, extra: []}; rebuild(); persist(); render(); toast('Built-in snapshot restored.');
  },
  'reset-progress'() {
    if (!confirm('Reset all training progress? Answers, mastery and batches will be cleared.')) return;
    Object.assign(state, {batches: [], current: null, draft: [], pool: {}, cards: {}, log: [], days: {}}); ui.quiz = null; ui.tquiz = null; persist(); render(); toast('Progress reset.');
  },
  'reset-all'() {
    if (!confirm('Reset everything, including settings and usage data?')) return;
    const keepPanel = 'usage'; state = defaultState(); state.ui.panel = keepPanel; ui.quiz = null; ui.tquiz = null; rebuild(); applyTheme(); persist(); render(); toast('Everything reset.');
  },
  'welcome-keep'() { closeModal(); state.ui.panel = 'train'; state.ui.trainSource = 'batch'; persist(); render(); },
  'welcome-new'() { closeModal(); state.ui.panel = 'batch'; persist(); render(); }
};

/* =========================================================
   Events
   ========================================================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = ACT[el.dataset.act];
  if (fn) { if (el.tagName === 'A') e.preventDefault(); fn(el, e); }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form]'); if (!f) return;
  e.preventDefault();
  if (f.dataset.form === 'quiz-name') submitName($('#qguess').value);
  if (f.dataset.form === 'quiz-recall') submitRecall($('#qa-spe').value.trim(), $('#qa-other').value.trim());
});
let qTimer;
document.addEventListener('input', e => {
  const k = e.target.dataset.input; if (!k) return;
  const v = e.target.value;
  clearTimeout(qTimer);
  if (k === 'usage-q') { ui.usageQuery = v; qTimer = setTimeout(() => { const tmp = document.createElement('div'); tmp.innerHTML = renderUsage(); renderRegion('usage-list', tmp.querySelector('#usage-list').outerHTML); }, 120); }
  if (k === 'batch-q') { ui.batchQuery = v; qTimer = setTimeout(() => { const tmp = document.createElement('div'); tmp.innerHTML = renderBatch(); renderRegion('batch-tiles', tmp.querySelector('#batch-tiles').outerHTML); }, 120); }
  if (k === 'types-q') { ui.typesQuery = v; qTimer = setTimeout(() => { const tmp = document.createElement('div'); tmp.innerHTML = renderTypes(); const fresh = tmp.querySelector('#type-grid'); const old = $('#type-grid'); if (fresh && old) old.replaceWith(fresh); }, 120); }
  if (k === 'study-q') { ui.studyQuery = v; qTimer = setTimeout(() => {
    const tmp = document.createElement('div'); tmp.innerHTML = renderTrain();
    const fresh = tmp.querySelector('.grid, .ladder, .empty:last-child'); const old = $('#main .grid, #main .ladder, #main .empty:last-child');
    if (fresh && old) old.replaceWith(fresh); else render();
  }, 120); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.input === 'study-sort') { state.ui.studySort = t.value; persist(); render(); return; }
  if (t.dataset.input === 'types-sort') { state.ui.typesSort = t.value; persist(); render(); return; }
  const key = t.dataset.setting; if (!key) return;
  let v = t.value;
  if (['tolerance', 'roundLength', 'batchSize'].includes(key)) {
    const lim = {tolerance: [0, 20], roundLength: [3, 200], batchSize: [1, 30]}[key];
    v = clamp(Math.round(+v || 0), lim[0], lim[1]); t.value = v;
  }
  state.settings[key] = v;
  if (key === 'imageSource') { persist(); render(); return; }
  persist(); renderNav();
});
$('#file-in').addEventListener('change', async e => {
  const file = e.target.files[0]; if (!file) return;
  importSaveText(await file.text());
});
document.addEventListener('keydown', e => {
  if (ui.modal === 'card' && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
    const order = ui.studyOrder; const i = order.indexOf(ui.cardId);
    if (order.length > 1 && i >= 0) { e.preventDefault(); openCard(order[(i + (e.key === 'ArrowRight' ? 1 : -1) + order.length) % order.length]); }
    return;
  }
  if (e.key === 'Escape' && ui.modal) { closeModal(); return; }
  const tag = (e.target.tagName || '').toLowerCase();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches?.('[role="button"][data-act]')) { e.preventDefault(); e.target.click(); return; }
  const q = curQ();
  if (!q || ui.modal || !['train', 'types'].includes(state.ui.panel) || q.done) return;
  if (q.cur?.answered && (e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undoAnswer(); return; }
  if (q.cur?.answered && e.key === 'Enter' && tag !== 'button') { e.preventDefault(); quizNext(); return; }
  if (q.kind === 'type' && !q.cur?.answered && tag !== 'input') {
    if (q.mode === 'tmult' && /^[1-6]$/.test(e.key)) { tSubmit(MULTS[+e.key - 1]); return; }
    if (q.mode !== 'tmult' && e.key === 'Enter' && tag !== 'button') { e.preventDefault(); tSubmit(); return; }
    return;
  }
  if (!q.cur?.answered && q.mode === 'name' && q.cur?.choices && /^[1-4]$/.test(e.key) && tag !== 'input') {
    const id = q.cur.choices[+e.key - 1]; if (id) submitName('', id);
  }
});

/* =========================================================
   Boot
   ========================================================= */
rebuild();
applyTheme();
if (!PANELS.some(p => p.id === state.ui.panel)) state.ui.panel = 'usage';
render();
initFileLink();
openWelcome();
state.lastOpen = Date.now();
persist();
/* installable app: register the offline worker when served over http(s) */
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && document.querySelector('link[rel="manifest"]')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(e => console.warn('Offline mode unavailable', e)));
}
</script>
</body>
</html>
